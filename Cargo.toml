[workspace]
resolver = "2"
members = [
    "crates/rust_media_core",
    "crates/rust_media_format",
    "crates/rust_media_codec",
    "crates/rust_media",
    "crates/rust_media_cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["rust_media contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/rust_media"

[workspace.dependencies]
# Internal crates
rust_media_core = { path = "crates/rust_media_core" }
rust_media_format = { path = "crates/rust_media_format" }
rust_media_codec = { path = "crates/rust_media_codec" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
