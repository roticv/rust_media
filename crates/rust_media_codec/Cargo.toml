[package]
name = "rust_media_codec"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Codec implementations for rust_media - H.264, VP9, AV1, AAC, Opus decoders and encoders"

[features]
default = []
# GPL-licensed features - enabling these changes the license of compiled binaries
gpl-x264 = ["x264"]
# FDK-AAC feature - Fraunhofer FDK AAC Codec License (not GPL, but has some restrictions)
fdk-aac = ["dep:fdk-aac"]
# VideoToolbox hardware acceleration (macOS only)
videotoolbox = []

[dependencies]
rust_media_core = { workspace = true }
audiopus = "0.3.0-rc.0"
vpx-rs = "0.2.1"
# rust_h264 - Pure Rust H.264 decoder (MIT/Apache-2.0)
rust_h264 = "0.2.0"
# GPL v2+ licensed - only included when gpl-x264 feature is enabled
x264 = { version = "0.5", optional = true }
# FDK-AAC - Fraunhofer FDK AAC Codec License
fdk-aac = { version = "0.7", optional = true }

# VideoToolbox dependencies (macOS only)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSDictionary", "NSValue"] }
objc2-core-foundation = "0.3"
objc2-core-media = { version = "0.3", features = ["CMFormatDescription", "CMSampleBuffer", "CMBlockBuffer", "CMTime"] }
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer"] }
objc2-video-toolbox = { version = "0.3", features = ["VTDecompressionSession", "VTSession", "VTDecompressionProperties"] }

[dev-dependencies]
rust_media_format = { workspace = true }
