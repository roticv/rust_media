[package]
name = "rust_media_codec"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Codec implementations for rust_media - H.264, VP9, AV1, AAC, Opus decoders and encoders"

[features]
default = []
# GPL-licensed features - enabling these changes the license of compiled binaries
gpl-x264 = ["x264"]
# FDK-AAC feature - Fraunhofer FDK AAC Codec License (not GPL, but has some restrictions)
fdk-aac = ["dep:fdk-aac"]

[dependencies]
rust_media_core = { workspace = true }
audiopus = "0.3.0-rc.0"
vpx-rs = "0.2.1"
# GPL v2+ licensed - only included when gpl-x264 feature is enabled
x264 = { version = "0.5", optional = true }
# FDK-AAC - Fraunhofer FDK AAC Codec License
fdk-aac = { version = "0.7", optional = true }

[dev-dependencies]
rust_media_format = { workspace = true }
