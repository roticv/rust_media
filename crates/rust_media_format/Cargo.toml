[package]
name = "rust_media_format"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Container format implementations for rust_media - MP4, MKV, WebM demuxers and muxers"

[features]
default = []
# GPL-licensed features for examples and tests
gpl-x264 = ["rust_media_codec/gpl-x264"]
# FDK-AAC feature for AAC encoding
fdk-aac = ["rust_media_codec/fdk-aac"]

[dependencies]
rust_media_core = { workspace = true }
byteorder = "1.5"

[dev-dependencies]
rust_media_codec = { path = "../rust_media_codec" }
