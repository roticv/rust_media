[package]
name = "rust_media_cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line tool for rust_media - media conversion and processing"

[[bin]]
name = "rust_media"
path = "src/main.rs"

[dependencies]
rust_media = { path = "../rust_media" }
rust_media_format = { path = "../rust_media_format" }
rust_media_codec = { path = "../rust_media_codec" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[features]
default = []
fdk-aac = ["rust_media_codec/fdk-aac"]
gpl-x264 = ["rust_media_codec/gpl-x264"]
